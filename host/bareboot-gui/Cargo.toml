[package]
name = "bareboot-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform graphical workbench for BareBoot using craft-libs and egui"

[dependencies]
bareboot-client = { path = "../bareboot-client" }
bareboot-engine = { path = "../../crates/bareboot-engine" }
bareboot-protocol = { workspace = true }
craft-ui = "1.4.7"
craft-settings = "1.4.7"
craft-atomic = "1.4.7"
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["default", "glow"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Navigator",
    "Serial",
    "SerialPort",
    "ReadableStream",
    "WritableStream",
    "ReadableStreamDefaultReader",
    "WritableStreamDefaultWriter",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = "0.9"
