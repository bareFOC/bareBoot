<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>BareBoot Workbench</title>
    <link data-trunk rel="rust" data-bin="bareboot-gui" data-wasm-opt="s" data-wasm-opt-params="--all-features" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            color: #E0E0E0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }
        #bareboot_canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading_splash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 16px;
            letter-spacing: 1px;
            color: #888888;
        }
    </style>
</head>
<body>
    <div id="loading_splash">Loading BareBoot Workbench...</div>
    <canvas id="bareboot_canvas"></canvas>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const splash = document.getElementById("loading_splash");
            if (splash) {
                setTimeout(() => splash.remove(), 1000);
            }
        });
    </script>
</body>
</html>
