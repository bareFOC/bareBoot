[workspace]
resolver = "2"
members = [
    "crates/bareboot-protocol",
    "crates/bareboot-core",
    "crates/bareboot-engine",
    "host/bareboot-client",
    "host/bareboot-cli",
    "host/bareboot-tui",
]
exclude = [
    "targets/rp2350-usb",
    "targets/ch32v203-usb",
    "tests/blink-test",
    "tests/flashprobe",
    "tests/standalone-pwriter",
    "tests/test-firmware/ch32-app-base",
    "tests/test-firmware/ch32-echo-pb",
    "tests/test-firmware/ch32-uart-echo",
    "tests/test-firmware/ch32-usb-boot",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
bareboot-protocol = { path = "crates/bareboot-protocol" }
bareboot-core = { path = "crates/bareboot-core" }
bareboot-engine = { path = "crates/bareboot-engine" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
