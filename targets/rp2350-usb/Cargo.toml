[package]
name = "bareboot-rp2350"
version = "0.1.0"
edition = "2021"
description = "Standalone RP2350 BareBoot target with USB CDC Katapult recovery"

[lib]
name = "bareboot_rp2350"
path = "src/lib.rs"

[[bin]]
name = "bareboot-rp2350"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bareboot-core = { path = "../../crates/bareboot-core" }
bareboot-protocol = { path = "../../crates/bareboot-protocol" }

# Hardware-only dependencies are ARM-only so `cargo test` can run the pure
# boot-decision helpers on the host without pulling in ARM inline assembly.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-rp = { version = "0.10.0", features = ["rp235xa", "critical-section-impl", "time-driver"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
embassy-usb = "0.6.0"
embassy-sync = "0.8.0"
static_cell = "2.1"
panic-halt = "1.0"
defmt = "1.0.1"
defmt-rtt = "1.0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
