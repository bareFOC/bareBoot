[package]
name = "bareboot-stm32f1-usb"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bluepill USB-only (experimental) bootloader"

[dependencies]
bareboot-core = { path = "../../../bareboot/crates/bareboot-core" }
bareboot-protocol = { path = "../../../bareboot/crates/bareboot-protocol" }
stm32f1xx-hal = { version = "0.11", features = ["stm32f103", "stm32-usbd"] }
usb-device = "0.3.2"
usbd-serial = "0.2.2"
cortex-m-rt = "0.7"
panic-halt = "0.2"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[features]
default = []
