[package]
name = "bareboot-stm32h503"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "STM32H503 (Miniata) target for BareBoot"

[dependencies]
bareboot-core = { workspace = true }
bareboot-protocol = { workspace = true }
cortex-m = "0.7"
cortex-m-rt = "0.7"
stm32-metapac = { version = "16", features = ["stm32h503kb", "pac", "rt"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[features]
default = ["transport-i2c"]
transport-can = []
transport-i2c = []
transport-uart = []
transport-usb = []