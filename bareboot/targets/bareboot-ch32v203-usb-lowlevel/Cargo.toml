[package]
name = "bareboot-ch32v203-usb-lowlevel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CH32V203 low-level USB CDC bootloader (experimental)"

[dependencies]
bareboot-core = { workspace = true }
bareboot-protocol = { workspace = true }
riscv-rt = "0.16"
heapless = "0.8"
ch32-metapac = { version = "0.1.2", features = ["ch32v203f8p6"] }
panic-halt = "0.2"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[features]
default = []
transport-usb = []
