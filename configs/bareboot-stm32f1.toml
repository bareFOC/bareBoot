[board]
name = "stm32f103-generic"
mcu = "stm32f103c8"
family = "stm32f1"
system_clock_hz = 8000000

[memory]
flash_origin = 0x08000000
flash_size = 65536
ram_origin = 0x20000000
ram_size = 20480
bootloader_origin = 0x08000000
bootloader_size = 8192
app_origin = 0x08002000

[communication.host]
protocol = "i2c"
role = "target"
bootloader = true
peripheral = "I2C1"
tx_scl_pin = "PB6"
rx_sda_pin = "PB7"
address = 0x40

[bootloader]
enabled = true
type = "bareboot"
boot_window_ms = 3000
preserve_nvm = true
