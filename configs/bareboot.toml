[board]
name = "ch32v203-generic"
mcu = "ch32v203c8t6"
family = "ch32v203"
system_clock_hz = 144000000

[memory]
flash_origin = 0x08000000
flash_size = 65536
ram_origin = 0x20000000
ram_size = 20480
bootloader_origin = 0x08000000
bootloader_size = 8192
app_origin = 0x08002000

[communication.can0]
protocol = "can"
role = "target"
bootloader = true
tx_scl_pin = "PB9"
rx_sda_pin = "PB8"
bitrate = 1000000

[communication.i2c0]
protocol = "i2c"
role = "target"
bootloader = true
tx_scl_pin = "PB6"
rx_sda_pin = "PB7"
address = 0x40

[bootloader]
enabled = true
type = "bareboot"
boot_window_ms = 250
preserve_nvm = true
